name: Dev Container Feature - Release

# Publishes the Dev Container Feature in features/src to GHCR
# (ghcr.io/dotnet/dev-proxy/dev-proxy). To release a new version of the
# Feature, bump the version in devcontainer-feature.json. Versions that are
# already published are skipped.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'features/src/**' ]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'dotnet/dev-proxy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish the Feature
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: 'true'
          base-path-to-features: ./features/src
          disable-repo-tagging: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
