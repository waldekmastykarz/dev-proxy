name: Dev Container Feature - Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'features/**', '.github/workflows/devcontainer-feature-test.yml' ]
  pull_request:
    paths: [ 'features/**', '.github/workflows/devcontainer-feature-test.yml' ]

permissions:
  contents: read

env:
  DEVCONTAINER_CLI_VERSION: 0.89.0

jobs:
  test-autogenerated:
    name: Test on ${{ matrix.baseImage }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-latest, ubuntu-24.04-arm ]
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Dev Container CLI
        run: npm install -g @devcontainers/cli@${{ env.DEVCONTAINER_CLI_VERSION }}
      - name: Test the Feature with default options, installed once and twice
        working-directory: features
        run: devcontainer features test --skip-scenarios -f dev-proxy -i ${{ matrix.baseImage }} .

  test-scenarios:
    name: Test scenarios (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-latest, ubuntu-24.04-arm ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Dev Container CLI
        run: npm install -g @devcontainers/cli@${{ env.DEVCONTAINER_CLI_VERSION }}
      - name: Test the Feature scenarios
        working-directory: features
        run: devcontainer features test -f dev-proxy --skip-autogenerated --skip-duplicated .

  validate:
    name: Validate the Feature metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate devcontainer-feature.json
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          validate-only: 'true'
          base-path-to-features: ./features/src
